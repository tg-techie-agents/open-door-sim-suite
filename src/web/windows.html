<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'; frame-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDoor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div id="storage-problem" role="alert" hidden></div>
<main id="desk"><div id="surface"></div></main>
<nav id="bar" aria-label="Taskbar"><button type="button" id="start" aria-haspopup="menu">Start</button><span id="tasks"></span></nav>
<span id="message" role="status"></span>
<div id="menubar" hidden></div>

<script src="transport.js"></script>

</html>
